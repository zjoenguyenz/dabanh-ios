name: DaBanh
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
targets:
  DaBanh:
    type: application
    platform: iOS
    sources:
      - DaBanh/DaBanhApp.swift
      - DaBanh/Channel.swift
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/PlaylistStore.swift
      - DaBanh/ContentView.swift
      - DaBanh/PlayerView.swift
      - DaBanh/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanh
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "Đá Banh"
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
