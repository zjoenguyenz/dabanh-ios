name: DaBanh
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
packages:
  # v2.0.3: KSPlayer (FFmpeg engine) for the torrent path only —
  # AVPlayer has no Matroska demuxer, so Torrentio/RD direct files
  # (predominantly MKV) could never start. Pinned exactly; the
  # 2.3.4 package's single product is "KSPlayer" and it carries
  # its own FFmpegKit + DisplayCriteria dependencies.
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "2.3.4"
  # v2.0.6: libwebp for the image pipeline's WebP fallback —
  # Tủ Phim posters exist ONLY as WebP and some KKPhim
  # posters are WebP too, and tvOS ImageIO has no WebP
  # codec, so those slots silently fell back to a different
  # (TMDB) poster. JoeImagePipeline calls libwebp's C
  # decode API directly; no SDWebImage core is pulled in.
  # Pinned exactly, like KSPlayer.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: "1.6.0"
targets:
  DaBanh:
    type: application
    platform: iOS
    sources:
      - DaBanh/DaBanhApp.swift
      - DaBanh/Channel.swift
      - DaBanh/Crests.swift
      - crests/crests.json
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/PlaylistStore.swift
      - DaBanh/MatchStateStore.swift
      - DaBanh/TeamNameNorm.swift
      - DaBanh/ContentView.swift
      - DaBanh/MatchViews.swift
      - DaBanh/PlayerView.swift
      - DaBanh/Theme.swift
      - DaBanh/Wallpapers.swift
      - DaBanh/MUHomeView.swift
      - DaBanh/MUMatchDetailView.swift
      - DaBanh/MUPlayerChrome.swift
      - DaBanh/MUBoardView.swift
      - DaBanh/Highlights.swift
      - DaBanh/HighlightViews.swift
      - DaBanh/Fonts/BarlowCondensed-ExtraBold.ttf
      - DaBanh/Fonts/Manrope-Regular.ttf
      - DaBanh/Fonts/Manrope-Medium.ttf
      - DaBanh/Fonts/Manrope-SemiBold.ttf
      - DaBanh/Fonts/Manrope-Bold.ttf
      - DaBanh/NuvioAddon.swift
      - DaBanh/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanh
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Swift 6 language mode for THIS target only (owner order
        # 2026-11-18): the base stays 5.9 so the tvOS targets in
        # this shared project are untouched.
        SWIFT_VERSION: "6.0"
        # This target's own settings pair (from 1.18): it previously
        # inherited the project base (1.5/6), which never matched
        # its info.properties pair — the pair the device shows.
        MARKETING_VERSION: "1.47"
        CURRENT_PROJECT_VERSION: "48"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "Đá Banh"
        CFBundleShortVersionString: "1.47"
        CFBundleVersion: "48"
        UIAppFonts:
          - BarlowCondensed-ExtraBold.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # H1 unit tests (StampYear). Not part of any app product and not
  # built by build-dabanh.yml; run with:
  #   xcodebuild test -project DaBanh.xcodeproj -scheme DaBanhTests \
  #     -destination 'platform=iOS Simulator,name=<any iPhone>'
  DaBanhTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DaBanhTests
    dependencies:
      - target: DaBanh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanh.tests
        GENERATE_INFOPLIST_FILE: YES
  DaBanhTV:
    type: application
    platform: tvOS
    sources:
      - DaBanh/Channel.swift
      - DaBanh/Crests.swift
      - DaBanh/TeamNameNorm.swift
      - crests/crests.json
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/PlaylistStore.swift
      - DaBanhTV/DaBanhTVApp.swift
      - DaBanhTV/TVContentView.swift
      - DaBanhTV/TVMatchViews.swift
      - DaBanhTV/TVPlayerView.swift
      - DaBanhTV/Assets.xcassets
    dependencies:
      - target: DaBanhTVTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanhtv
        INFOPLIST_FILE: InfoTV.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.3.5"
        CURRENT_PROJECT_VERSION: "17"
    info:
      path: InfoTV.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "Đá Banh"
        CFBundleShortVersionString: "1.3.5"
        CFBundleVersion: "17"
        CFBundleIconName: "AppIcon"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: "AppIcon"
        UILaunchScreen: {}
  TV:
    type: application
    platform: tvOS
    sources:
      - DaBanh/Channel.swift
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/LinkProbe.swift
      - DaBanhTV/TVPlayerView.swift
      - TVApp/TVApp.swift
      - TVApp/TVStore.swift
      - TVApp/TVHomeView.swift
      - TVApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.tv
        INFOPLIST_FILE: InfoTVApp.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "4"
    info:
      path: InfoTVApp.plist
      properties:
        CFBundleDisplayName: "TV"
        CFBundleName: "TV"
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
  JoeTV:
    type: application
    platform: tvOS
    sources:
      - DaBanh/Channel.swift
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/LinkProbe.swift
      - DaBanhTV/TVPlayerView.swift
      - TVApp/TVStore.swift
      - JoeTV/JoeModels.swift
      - JoeTV/JoeHTTP.swift
      - JoeTV/SourceHealth.swift
      - JoeTV/KkClient.swift
      - JoeTV/VsClient.swift
      - JoeTV/F4kClient.swift
      - JoeTV/TpClient.swift
      - JoeTV/CacheVideo.swift
      - JoeTV/JoeProxy.swift
      - JoeTV/Providers.swift
      - JoeTV/WatchStore.swift
      - JoeTV/JoeFollowStore.swift
      - JoeTV/JoeChannelFavourites.swift
      - JoeTV/JoeActorPage.swift
      - JoeTV/TorrentClient.swift
      - JoeTV/JoePlayerView.swift
      - JoeTV/JoeStreamWarmer.swift
      - JoeTV/JoeKSPlayerView.swift
      - JoeTV/JoeTheme.swift
      - JoeTV/JoeImagePipeline.swift
      - JoeTV/JoeTVApp.swift
      - JoeTV/JoeTopShelfWriter.swift
      - JoeTV/JoeTVSection.swift
      - JoeTV/JoePhimHome.swift
      - JoeTV/JoeBrowse.swift
      - JoeTV/JoeMovieDetail.swift
      - JoeTV/JoeDetailCache.swift
      - JoeTV/JoeSearch.swift
      - JoeTV/JoeTVB.swift
      - JoeTV/tvb-catalog.json
      - JoeTV/JoeTorrent.swift
      - JoeTV/JoeSettings.swift
      - JoeTV/JoeStores.swift
      - JoeTV/SourceProbe.swift
      - JoeTV/TMDBClient.swift
      - JoeTV/TMDBKey.swift
      - JoeTV/BundledTokens.swift
      - JoeTV/Assets.xcassets
    dependencies:
      - package: KSPlayer
      - package: libwebp
      - target: JoeTVTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.joetv
        INFOPLIST_FILE: InfoJoeTV.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.31"
        CURRENT_PROJECT_VERSION: "44"
    info:
      path: InfoJoeTV.plist
      properties:
        CFBundleDisplayName: "Joe TV"
        CFBundleName: "Joe TV"
        CFBundleShortVersionString: "2.0.31"
        CFBundleVersion: "44"
        CFBundleIconName: "AppIcon"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: "AppIcon"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.luun.nguyen.joetv
            CFBundleURLSchemes:
              - joetv
    entitlements:
      path: JoeTV/JoeTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.luun.nguyen.joetv
  JoeTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - JoeTVTopShelf/TopShelfProvider.swift
      - JoeTVTopShelf/TMDBShelfKey.swift
      - JoeTVTopShelf/bundled/shelf-manifest.json
      - JoeTVTopShelf/bundled/shelf-1.jpg
      - JoeTVTopShelf/bundled/shelf-2.jpg
      - JoeTVTopShelf/bundled/shelf-3.jpg
      - JoeTVTopShelf/bundled/shelf-4.jpg
      - JoeTVTopShelf/bundled/shelf-5.jpg
      - JoeTVTopShelf/bundled/shelf-6.jpg
      - JoeTVTopShelf/bundled/shelf-7.jpg
      - JoeTVTopShelf/bundled/shelf-8.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.joetv.topshelf
        INFOPLIST_FILE: InfoJoeTVTopShelf.plist
    info:
      path: InfoJoeTVTopShelf.plist
      properties:
        CFBundleDisplayName: "Joe TV"
        CFBundleName: "JoeTVTopShelf"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
    entitlements:
      path: JoeTVTopShelf/JoeTVTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.luun.nguyen.joetv
  DaBanhTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - DaBanhTVTopShelf/TopShelfProvider.swift
      - DaBanhTVTopShelf/mu-shelf-1.jpg
      - DaBanhTVTopShelf/mu-shelf-2.jpg
      - DaBanhTVTopShelf/mu-shelf-3.jpg
      - DaBanhTVTopShelf/mu-shelf-4.jpg
      - DaBanhTVTopShelf/mu-shelf-5.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanhtv.topshelf
        INFOPLIST_FILE: InfoDaBanhTVTopShelf.plist
    info:
      path: InfoDaBanhTVTopShelf.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "DaBanhTVTopShelf"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
