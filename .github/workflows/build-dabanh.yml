name: Build DaBanh IPA

# Builds the Đá Banh app as an UNSIGNED .ipa (normal, entitlement-free app).
# The owner signs IPAs himself with his own signing app, so the workflow
# builds with CODE_SIGNING_ALLOWED=NO and simply zips the .app into a
# Payload/ layout. No codesign step, no entitlements anywhere.

on:
  workflow_dispatch:
  push:
    branches: [main, dabanh-ios]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute unique artifact name
        id: names
        run: |
          DATE="$(date +%Y%m%d)"
          NAME="DaBanh-ipa-run${{ github.run_number }}-${DATE}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact / IPA name: ${NAME}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project DaBanh.xcodeproj \
            -scheme DaBanh \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
          test -d "$PWD/build/app/DaBanh.app"
          ls -la "$PWD/build/app/DaBanh.app"

      - name: Assemble IPA
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$PWD/build/app/DaBanh.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"
          shasum -a 256 "${NAME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.name }}.ipa
          if-no-files-found: error
