name: Build JoeTV IPA

# Builds the Joe TV app (tvOS) as an UNSIGNED .ipa, exactly like the
# other apps in this repo: the owner signs IPAs himself (Signulous),
# so the workflow builds with CODE_SIGNING_ALLOWED=NO and zips the
# .app into a Payload/ layout. Dispatch-only, single target, so one
# dispatch spends exactly one macOS job.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-joetv:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute unique artifact name
        id: names
        run: |
          DATE="$(date +%Y%m%d)"
          NAME="JoeTV-ipa-run${{ github.run_number }}-${DATE}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact / IPA name: ${NAME}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project DaBanh.xcodeproj \
            -scheme JoeTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app-joetv" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
          test -d "$PWD/build/app-joetv/JoeTV.app"
          ls -la "$PWD/build/app-joetv/JoeTV.app"

      - name: Assemble IPA
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$PWD/build/app-joetv/JoeTV.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"
          shasum -a 256 "${NAME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.name }}.ipa
          if-no-files-found: error
